# Trial target ESP32-S3_raw: the trials compiled by binaries/silica-compiler-ESP32-S3_raw and run on
# an ESP32-S3 board over USB. Read by trial_target.sh (see README.md in this directory).
# Paths are relative to the repository root; environment variables override the defaults.

TARGET_DESCRIPTION="ESP32-S3 board over USB (bare metal)"

# Board pack: runtime, image builder (tools/build_image.sh) and runner (tools/run_on_board.py).
TARGET_BOARD_DIR="compiler/silica-compiler/src_selfhost/emitter/ESP32-S3_raw/board"

# Python with esptool and pyserial (the ESP-IDF Python environment). Override: BOARD_PYTHON.
TARGET_PYTHON="$HOME/.espressif/python_env/idf6.2_py3.14_env/bin/python"
