[package]
name = "silica-bootstrap-compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
# Updated LLVM backend dependencies for LLVM 15 (compatible with inkwell)
inkwell = { version = "0.7.1", features = ["llvm15-0"], optional = true }
llvm-sys = { version = "150", optional = true }
# Error handling
thiserror = "1.0"
# System interface for CPU topology detection
libc = "0.2"

[features]
llvm_backend = ["inkwell", "llvm-sys"]

[lib]
name = "silica_compiler"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "silica-boot"
path = "src/main.rs"
