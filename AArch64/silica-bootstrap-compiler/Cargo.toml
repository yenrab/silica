[package]
name = "silica-bootstrap-compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
# Real LLVM backend dependencies for Phase 1C
inkwell = { version = "0.2.0", features = ["llvm15-0"], optional = true }
llvm-sys = { version = "150.0.3", optional = true }
# Error handling
thiserror = "1.0"

[features]
llvm_backend = ["inkwell", "llvm-sys"]

[lib]
name = "silica_compiler"
path = "src/lib.rs"

[[bin]]
name = "silica"
path = "src/main.rs"
