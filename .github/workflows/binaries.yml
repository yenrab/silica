# Build silica-compiler for every host this tree can produce, and upload the
# binaries. A tag push v* also attaches them to a GitHub release.
#
# Native hosts: macOS arm64, Linux x86_64, Linux aarch64.
# The Linux compilers are emitted on macOS (bootstrap-assembly) and linked on
# the Linux runner (bootstrap-link). Cross compilers that run on macOS and emit
# for linux_aarch64, linux_x86_64, and ESP32-S3_raw are uploaded too.
# There is no Windows emitter or runtime, so no Windows executable is produced.

name: Compiler binaries

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - ".github/workflows/pages.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build the host compiler
        working-directory: compiler/silica-compiler/src_selfhost
        run: |
          set -euo pipefail
          make build \
            TARGET=apple_silicon_mac \
            EXECUTABLE=silica-compiler-apple_silicon_mac \
            INSTALL_SELFHOST=0 \
            SILICA_TARGET_PROMPT=0
          file silica-compiler-apple_silicon_mac | grep -q 'Mach-O'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: silica-macos-arm64
          path: |
            compiler/silica-compiler/src_selfhost/silica-compiler-apple_silicon_mac
          if-no-files-found: error

  cross:
    name: Emit ${{ matrix.target }}
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: [linux_aarch64, linux_x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build the macOS-hosted cross compiler
        working-directory: compiler/silica-compiler/src_selfhost
        run: |
          set -euo pipefail
          make build \
            TARGET=${{ matrix.target }} \
            EXECUTABLE=silica-compiler-${{ matrix.target }} \
            INSTALL_SELFHOST=0 \
            SILICA_TARGET_PROMPT=0
          file "silica-compiler-${{ matrix.target }}" | grep -q 'Mach-O'
      - name: Upload the cross compiler
        uses: actions/upload-artifact@v4
        with:
          name: silica-cross-${{ matrix.target }}
          path: compiler/silica-compiler/src_selfhost/silica-compiler-${{ matrix.target }}
          if-no-files-found: error
      - name: Emit assembly for the Linux host
        run: |
          set -euo pipefail
          src=compiler/silica-compiler/src_selfhost
          built="$PWD/$src/silica-compiler-${{ matrix.target }}"
          ln -sfn "$built" "$PWD/binaries/silica-compiler-${{ matrix.target }}"
          make -C "$src" bootstrap-assembly \
            BOOTSTRAP_TARGET=${{ matrix.target }} \
            SILICA_TARGET_PROMPT=0
          cd "$src"
          find . -name '*.sams' -type f ! -path './_wd_probe/*' | LC_ALL=C sort > "$RUNNER_TEMP/sams.list"
          count="$(wc -l < "$RUNNER_TEMP/sams.list" | tr -d ' ')"
          echo "emitted $count .sams files"
          test "$count" -gt 100
          COPYFILE_DISABLE=1 tar -cf "$RUNNER_TEMP/sams.tar" -T "$RUNNER_TEMP/sams.list"
      - name: Upload emitted assembly
        uses: actions/upload-artifact@v4
        with:
          name: sams-${{ matrix.target }}
          path: ${{ runner.temp }}/sams.tar
          if-no-files-found: error

  esp32:
    name: ESP32-S3 cross compiler
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build the macOS-hosted ESP32-S3 compiler
        working-directory: compiler/silica-compiler/src_selfhost
        run: |
          set -euo pipefail
          make build \
            TARGET=ESP32-S3_raw \
            EXECUTABLE=silica-compiler-ESP32-S3_raw \
            INSTALL_SELFHOST=0 \
            SILICA_TARGET_PROMPT=0
          file silica-compiler-ESP32-S3_raw | grep -q 'Mach-O'
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: silica-cross-ESP32-S3_raw
          path: compiler/silica-compiler/src_selfhost/silica-compiler-ESP32-S3_raw
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.artifact }}
    needs: cross
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86_64
            runner: ubuntu-24.04
            artifact: x86_64
          - target: linux_aarch64
            runner: ubuntu-24.04-arm
            artifact: aarch64
    steps:
      - uses: actions/checkout@v4
      - name: Assembler and linker
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Download emitted assembly
        uses: actions/download-artifact@v4
        with:
          name: sams-${{ matrix.target }}
          path: ${{ runner.temp }}/sams
      - name: Link the native compiler
        working-directory: compiler/silica-compiler/src_selfhost
        run: |
          set -euo pipefail
          tar -xf "$RUNNER_TEMP/sams/sams.tar" -C .
          make bootstrap-link SILICA_TARGET_PROMPT=0 INSTALL_SELFHOST=0
          file silica-compiler | grep -q ELF
          mv silica-compiler "$RUNNER_TEMP/silica"
          (cd "$RUNNER_TEMP" && sha256sum silica > SHA256SUMS)
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: silica-linux-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/silica
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error

  windows:
    name: Windows (no backend yet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report the missing Windows backend
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(compiler/silica-compiler/src_selfhost/emitter/windows*/emitter_core.silica)
          if (( ${#found[@]} )); then
            echo "A Windows emitter is present (${found[0]}) but this workflow has no Windows link recipe."
            exit 1
          fi
          {
            echo "### Windows"
            echo "No Windows executable is uploaded. \`src_selfhost/emitter/\` has no Windows backend, and \`src_selfhost/runtime_asm/\` has no Windows runtime."
            echo "Native binaries from the other jobs: macOS arm64, Linux x86_64, Linux aarch64."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: [macos, cross, esp32, linux]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: silica-*
          path: dist
      - name: Publish the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/release"
          mkdir -p "$stage"
          find dist -type f ! -name SHA256SUMS | while IFS= read -r file; do
            parent="$(basename "$(dirname "$file")")"
            cp "$file" "$stage/$parent"
            chmod +x "$stage/$parent"
          done
          (cd "$stage" && sha256sum -- * | sort > SHA256SUMS)
          tag="${{ github.ref_name }}"
          gh release create "$tag" "$stage"/* \
            --title "$tag" \
            --generate-notes \
            --verify-tag
